version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AADS_SERVER__ADDR=0.0.0.0:8080
      - AADS_DATABASE__URL=sqlite:/data/aads.db?mode=rwc
      - AADS_ELASTICSEARCH__URL=http://elasticsearch:9200
      - AADS_OIDC__ISSUER_URL=http://keycloak:8080/realms/master
      - AADS_OIDC__CLIENT_ID=aads
      - AADS_OIDC__CLIENT_SECRET=${OIDC_CLIENT_SECRET:-secret}
      - AADS_OIDC__JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - RUST_LOG=debug
      - TZ=Asia/Seoul
    volumes:
      - aads_data:/data
    ports:
      - "8080:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q green"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      - CLICKHOUSE_DB=aads
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ch_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  aads_data:
  es_data:
  ch_data:
